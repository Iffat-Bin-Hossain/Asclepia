name: Asclepia CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── FRONTEND CI: Typecheck, Lint & Build ───
  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.asclepia.health/api' }}

  # ─── BACKEND CI: Dependency & Syntax Validation ───
  backend-ci:
    name: Backend Syntax & Dependency Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Server Syntax
        run: node -c src/server.js
